name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin
        run: |
          mkdir -p build/delivery-calendar
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/delivery-calendar/

      - name: Create ZIP
        run: |
          cd build
          zip -r delivery-calendar.zip delivery-calendar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-calendar
          path: build/delivery-calendar.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/delivery-calendar.zip
          generate_release_notes: true
